<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Meeting Copilot - 完全免费版 | 无需API Key</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <style>
        .toast {
            position: fixed;
            bottom: 20px;
            right: 20px;
            background: #1f2937;
            color: white;
            padding: 12px 24px;
            border-radius: 8px;
            z-index: 1000;
            animation: slideIn 0.3s ease;
        }
        @keyframes slideIn {
            from { transform: translateX(100%); opacity: 0; }
            to { transform: translateX(0); opacity: 1; }
        }
        .loading {
            display: inline-block;
            width: 20px;
            height: 20px;
            border: 2px solid #f3f3f3;
            border-top: 2px solid #3b82f6;
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        .recording {
            animation: pulse 1.5s infinite;
        }
        @keyframes pulse {
            0% { box-shadow: 0 0 0 0 rgba(239, 68, 68, 0.7); }
            70% { box-shadow: 0 0 0 10px rgba(239, 68, 68, 0); }
            100% { box-shadow: 0 0 0 0 rgba(239, 68, 68, 0); }
        }
        .waveform {
            display: flex;
            align-items: center;
            gap: 3px;
            height: 40px;
        }
        .waveform-bar {
            width: 3px;
            height: 20px;
            background-color: #ef4444;
            animation: wave 0.8s ease-in-out infinite;
        }
        @keyframes wave {
            0%, 100% { height: 10px; }
            50% { height: 30px; }
        }
        .ai-badge {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        }
    </style>
</head>
<body class="bg-gray-50">
    <div class="max-w-7xl mx-auto px-4 py-8">
        <!-- Header -->
        <div class="text-center mb-8">
            <div class="inline-block ai-badge text-white px-4 py-1 rounded-full text-sm mb-3">✨ 完全免费 ✨</div>
            <h1 class="text-3xl font-bold text-gray-900">🎙️ AI Meeting Copilot</h1>
            <p class="text-gray-600 mt-2">智能会议助手 - 支持录音、智能分析、任务追踪 | <span class="text-green-600 font-semibold">无需API Key，永久免费！</span></p>
        </div>

        <!-- 免费提示 -->
        <div class="bg-gradient-to-r from-green-50 to-emerald-50 border border-green-200 rounded-lg p-4 mb-6">
            <div class="flex items-center gap-2">
                <span class="text-2xl">🎉</span>
                <div>
                    <span class="text-green-800 font-semibold">完全免费！</span>
                    <span class="text-green-700 text-sm ml-2">使用本地智能分析引擎，不消耗任何API额度</span>
                </div>
            </div>
        </div>

        <div class="grid lg:grid-cols-2 gap-6">
            <!-- 左侧：录音和输入区域 -->
            <div class="space-y-6">
                <!-- 录音卡片 -->
                <div class="bg-white rounded-lg shadow p-6">
                    <h2 class="text-lg font-semibold mb-3">🎤 实时录音</h2>
                    
                    <div class="bg-gradient-to-r from-red-50 to-orange-50 rounded-lg p-4 mb-4">
                        <div class="flex items-center justify-between mb-3">
                            <div class="flex gap-3">
                                <button id="startRecordBtn" onclick="startRecording()" class="px-5 py-2 bg-red-600 text-white rounded-lg hover:bg-red-700 flex items-center gap-2">
                                    <i class="fas fa-microphone"></i> 开始录音
                                </button>
                                <button id="stopRecordBtn" onclick="stopRecording()" disabled class="px-5 py-2 bg-gray-400 text-white rounded-lg cursor-not-allowed flex items-center gap-2">
                                    <i class="fas fa-stop"></i> 停止录音
                                </button>
                                <button onclick="clearRecording()" class="px-4 py-2 bg-gray-200 text-gray-700 rounded-lg hover:bg-gray-300">
                                    <i class="fas fa-trash"></i> 清除
                                </button>
                            </div>
                            <div id="recordStatus" class="text-sm text-gray-600">
                                ⚪ 未开始
                            </div>
                        </div>
                        
                        <div id="waveform" class="waveform justify-center hidden">
                            <div class="waveform-bar" style="animation-delay: 0s"></div>
                            <div class="waveform-bar" style="animation-delay: 0.1s"></div>
                            <div class="waveform-bar" style="animation-delay: 0.2s"></div>
                            <div class="waveform-bar" style="animation-delay: 0.3s"></div>
                            <div class="waveform-bar" style="animation-delay: 0.4s"></div>
                            <div class="waveform-bar" style="animation-delay: 0.5s"></div>
                        </div>
                        
                        <div id="recordDuration" class="text-xs text-gray-500 mt-2 hidden">
                            录音时长: <span id="duration">0</span> 秒
                        </div>
                    </div>
                    
                    <div class="mt-4">
                        <div class="flex justify-between items-center mb-2">
                            <label class="font-medium text-gray-700">📝 转写文本</label>
                            <button onclick="transcribeWithWebSpeech()" id="transcribeBtn" disabled class="text-sm bg-green-600 text-white px-3 py-1 rounded-lg hover:bg-green-700 disabled:bg-gray-300 disabled:cursor-not-allowed">
                                🎯 免费语音识别
                            </button>
                        </div>
                        <textarea id="transcribedText" rows="6" class="w-full border border-gray-300 rounded-lg p-3 focus:outline-none focus:ring-2 focus:ring-blue-500 font-mono text-sm" placeholder="录音转写结果会显示在这里..."></textarea>
                        <p class="text-xs text-gray-400 mt-1">💡 使用浏览器内置语音识别，完全免费！</p>
                    </div>
                </div>
                
                <!-- 会议记录输入 -->
                <div class="bg-white rounded-lg shadow p-6">
                    <h2 class="text-lg font-semibold mb-3">📝 会议记录</h2>
                    <textarea id="meetingText" rows="8" class="w-full border border-gray-300 rounded-lg p-3 focus:outline-none focus:ring-2 focus:ring-blue-500 font-mono text-sm" placeholder="粘贴会议记录或录音转写结果..."></textarea>
                    <div class="flex gap-2 mt-4">
                        <button onclick="processWithLocalAI()" id="processBtn" class="flex-1 px-4 py-2 bg-blue-600 text-white rounded-lg hover:bg-blue-700 font-medium">
                            🚀 免费智能分析
                        </button>
                        <button onclick="loadExample()" class="px-4 py-2 bg-gray-200 text-gray-700 rounded-lg hover:bg-gray-300">
                            示例数据
                        </button>
                        <button onclick="clearAll()" class="px-4 py-2 bg-gray-200 text-gray-700 rounded-lg hover:bg-gray-300">
                            清空
                        </button>
                    </div>
                </div>

                <!-- 历史记录 -->
                <div class="bg-white rounded-lg shadow p-6">
                    <h2 class="text-lg font-semibold mb-3">📚 历史会议</h2>
                    <div id="historyList" class="space-y-2 max-h-48 overflow-y-auto">
                        <p class="text-gray-400 text-sm">暂无历史记录</p>
                    </div>
                </div>
            </div>

            <!-- 右侧：AI输出区域 -->
            <div class="space-y-6">
                <div class="bg-white rounded-lg shadow p-6">
                    <h2 class="text-lg font-semibold mb-3">📌 智能会议总结</h2>
                    <div id="summary" class="prose max-w-none text-gray-700 text-sm leading-relaxed bg-gray-50 p-4 rounded-lg min-h-[100px]">
                        等待分析...
                    </div>
                </div>

                <div class="bg-white rounded-lg shadow p-6">
                    <h2 class="text-lg font-semibold mb-3">⚖️ 决策 & 风险</h2>
                    <div id="decisions" class="bg-gray-50 p-4 rounded-lg min-h-[100px] text-sm">
                        等待分析...
                    </div>
                </div>

                <div class="bg-white rounded-lg shadow p-6">
                    <h2 class="text-lg font-semibold mb-3">✅ 行动项</h2>
                    <div id="actions" class="space-y-2">
                        <p class="text-gray-400 text-sm">等待分析...</p>
                    </div>
                    <div class="flex gap-2 mt-4 pt-4 border-t">
                        <button onclick="exportToNotion()" class="flex-1 px-3 py-2 bg-purple-600 text-white rounded-lg hover:bg-purple-700 text-sm">
                            📤 导出到 Notion
                        </button>
                        <button onclick="exportToJira()" class="flex-1 px-3 py-2 bg-blue-600 text-white rounded-lg hover:bg-blue-700 text-sm">
                            🔷 导出到 Jira
                        </button>
                    </div>
                </div>

                <div class="bg-white rounded-lg shadow p-6">
                    <h2 class="text-lg font-semibold mb-3">📧 跟进邮件</h2>
                    <div id="email" class="bg-gray-50 p-4 rounded-lg text-sm font-mono whitespace-pre-wrap min-h-[150px]">
                        等待生成...
                    </div>
                    <div class="flex gap-2 mt-4">
                        <button onclick="copyEmail()" class="flex-1 px-3 py-2 bg-green-600 text-white rounded-lg hover:bg-green-700 text-sm">
                            📋 复制邮件
                        </button>
                        <button onclick="sendEmail()" class="flex-1 px-3 py-2 bg-indigo-600 text-white rounded-lg hover:bg-indigo-700 text-sm">
                            ✉️ 模拟发送
                        </button>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        // 全局变量
        let currentData = {
            summary: '',
            decisions: '',
            actions: [],
            email: ''
        };
        
        // 录音相关
        let mediaRecorder = null;
        let audioChunks = [];
        let isRecording = false;
        let startTime = null;
        let durationInterval = null;
        let recordedBlob = null;

        // 加载历史
        loadHistory();

        // 开始录音
        window.startRecording = async function() {
            try {
                const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
                mediaRecorder = new MediaRecorder(stream);
                audioChunks = [];
                
                mediaRecorder.ondataavailable = (event) => {
                    audioChunks.push(event.data);
                };
                
                mediaRecorder.onstop = () => {
                    recordedBlob = new Blob(audioChunks, { type: 'audio/webm' });
                    document.getElementById('transcribeBtn').disabled = false;
                    showToast('录音完成！点击"免费语音识别"转写文字', 'success');
                    stream.getTracks().forEach(track => track.stop());
                };
                
                mediaRecorder.start();
                isRecording = true;
                startTime = Date.now();
                
                document.getElementById('startRecordBtn').disabled = true;
                document.getElementById('stopRecordBtn').disabled = false;
                document.getElementById('recordStatus').innerHTML = '🔴 录音中...';
                document.getElementById('waveform').classList.remove('hidden');
                document.getElementById('recordDuration').classList.remove('hidden');
                
                durationInterval = setInterval(() => {
                    const seconds = Math.floor((Date.now() - startTime) / 1000);
                    document.getElementById('duration').innerText = seconds;
                }, 1000);
                
            } catch (error) {
                showToast('无法访问麦克风，请检查权限', 'error');
            }
        };

        // 停止录音
        window.stopRecording = function() {
            if (mediaRecorder && isRecording) {
                mediaRecorder.stop();
                isRecording = false;
                document.getElementById('startRecordBtn').disabled = false;
                document.getElementById('stopRecordBtn').disabled = true;
                document.getElementById('recordStatus').innerHTML = '⚪ 录音已停止';
                if (durationInterval) clearInterval(durationInterval);
            }
        };

        // 清除录音
        window.clearRecording = function() {
            recordedBlob = null;
            document.getElementById('transcribedText').value = '';
            document.getElementById('transcribeBtn').disabled = true;
            document.getElementById('waveform').classList.add('hidden');
            document.getElementById('recordDuration').classList.add('hidden');
            showToast('已清除录音', 'info');
        };

        // 使用浏览器内置语音识别（完全免费！）
        window.transcribeWithWebSpeech = function() {
            if (!('webkitSpeechRecognition' in window) && !('SpeechRecognition' in window)) {
                showToast('您的浏览器不支持语音识别，请使用Chrome或Edge', 'error');
                return;
            }
            
            const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
            const recognition = new SpeechRecognition();
            
            recognition.lang = 'zh-CN';
            recognition.interimResults = false;
            recognition.maxAlternatives = 1;
            
            showToast('🎤 请开始说话...', 'info');
            
            recognition.start();
            
            recognition.onresult = (event) => {
                const transcript = event.results[0][0].transcript;
                document.getElementById('transcribedText').value = transcript;
                document.getElementById('meetingText').value = transcript;
                showToast('✅ 语音转写完成！', 'success');
            };
            
            recognition.onerror = (event) => {
                showToast('语音识别失败: ' + event.error, 'error');
            };
        };

        // 本地智能分析（完全免费，不调用任何API）
        window.processWithLocalAI = function() {
            let meetingText = document.getElementById('meetingText').value.trim();
            const transcribedText = document.getElementById('transcribedText').value.trim();
            
            if (!meetingText && transcribedText) {
                meetingText = transcribedText;
                document.getElementById('meetingText').value = transcribedText;
            }
            
            if (!meetingText) {
                showToast('请先输入会议记录或录音转写', 'error');
                return;
            }

            const btn = document.getElementById('processBtn');
            const originalText = btn.innerHTML;
            btn.innerHTML = '<span class="loading"></span> 智能分析中...';
            btn.disabled = true;

            // 模拟AI分析延迟，更真实
            setTimeout(() => {
                const result = localAIAnalysis(meetingText);
                currentData = result;
                updateUI();
                saveToHistory(meetingText, result);
                showToast('✅ 分析完成！', 'success');
                btn.innerHTML = originalText;
                btn.disabled = false;
            }, 800);
        };

        // 本地AI分析引擎（基于规则和关键词提取）
        function localAIAnalysis(text) {
            // 提取关键信息
            const lines = text.split('\n');
            
            // 生成总结
            let summary = generateSummary(text, lines);
            
            // 提取决策和风险
            let decisions = extractDecisions(text, lines);
            let risks = extractRisks(text, lines);
            
            // 提取行动项
            let actions = extractActions(text, lines);
            
            // 生成邮件
            let email = generateEmail(summary, actions);
            
            return {
                summary: summary,
                decisions: decisions + (risks ? '\n\n⚠️ 风险：\n' + risks : ''),
                actions: actions,
                email: email
            };
        }
        
        // 生成总结
        function generateSummary(text, lines) {
            let summary = '📋 会议总结\n\n';
            
            // 尝试提取日期
            const dateMatch = text.match(/(\d{4}年\d{1,2}月\d{1,2}日|\d{4}-\d{1,2}-\d{1,2})/);
            if (dateMatch) {
                summary += `会议时间：${dateMatch[0]}\n`;
            }
            
            // 提取参会人员
            const peopleMatch = text.match(/参会[人员：:]\s*([^\n]+)/i);
            if (peopleMatch) {
                summary += `参会人员：${peopleMatch[1]}\n`;
            }
            
            // 提取主要内容
            summary += '\n主要讨论内容：\n';
            const contentLines = [];
            for (let line of lines) {
                if (line.includes('讨论') || line.includes('内容') || line.match(/^\d+\./)) {
                    contentLines.push(line.trim());
                }
            }
            
            if (contentLines.length > 0) {
                summary += contentLines.slice(0, 5).map(l => `• ${l}`).join('\n');
            } else {
                summary += '• ' + text.substring(0, 200) + '...';
            }
            
            return summary;
        }
        
        // 提取决策
        function extractDecisions(text, lines) {
            let decisions = '';
            let hasDecision = false;
            
            for (let line of lines) {
                if (line.includes('决策') || line.includes('决定') || line.includes('确定')) {
                    hasDecision = true;
                    decisions += `• ${line.trim()}\n`;
                }
            }
            
            if (!hasDecision) {
                decisions = '• 会议中未明确记录决策，建议会后确认关键结论\n';
            }
            
            return '✅ 关键决策：\n' + decisions;
        }
        
        // 提取风险
        function extractRisks(text, lines) {
            let risks = '';
            let hasRisk = false;
            
            for (let line of lines) {
                if (line.includes('风险') || line.includes('问题') || line.includes('延期') || line.includes('困难')) {
                    hasRisk = true;
                    risks += `• ${line.trim()}\n`;
                }
            }
            
            if (!hasRisk) {
                risks = '• 未识别到明显风险\n';
            }
            
            return risks;
        }
        
        // 提取行动项
        function extractActions(text, lines) {
            let actions = [];
            let actionKeywords = ['负责', '完成', '提交', '开发', '测试', '部署', '跟进', '确认', '沟通'];
            
            // 尝试从文本中提取行动项
            for (let line of lines) {
                let hasAction = false;
                for (let keyword of actionKeywords) {
                    if (line.includes(keyword) && line.length > 5 && line.length < 100) {
                        hasAction = true;
                        break;
                    }
                }
                
                if (hasAction || line.match(/^\d+\./)) {
                    // 尝试提取负责人
                    let owner = '待定';
                    const ownerMatch = line.match(/([^\s]+)(?:负责|完成|提交)/);
                    if (ownerMatch) owner = ownerMatch[1];
                    
                    // 尝试提取截止日期
                    let deadline = '待定';
                    const deadlineMatch = line.match(/(\d{1,2}月\d{1,2}日|\d{4}-\d{1,2}-\d{1,2}|\d+月\d+日前)/);
                    if (deadlineMatch) deadline = deadlineMatch[0];
                    
                    actions.push({
                        task: line.trim(),
                        owner: owner,
                        deadline: deadline
                    });
                }
            }
            
            // 如果没有提取到，生成默认行动项
            if (actions.length === 0) {
                actions = [
                    { task: '整理会议纪要并发送给参会人员', owner: '会议组织者', deadline: '会议结束后24小时内' },
                    { task: '跟进会议中讨论的关键事项', owner: '项目负责人', deadline: '本周内' },
                    { task: '确认下一步行动计划和时间节点', owner: '全体参会人员', deadline: '下次会议前' }
                ];
            }
            
            return actions.slice(0, 5); // 最多5个行动项
        }
        
        // 生成邮件
        function generateEmail(summary, actions) {
            const date = new Date().toLocaleDateString('zh-CN');
            let email = `主题：会议跟进 - ${date}\n\n`;
            email += `各位好，\n\n`;
            email += `感谢大家参加本次会议。以下是会议总结和待办事项：\n\n`;
            email += `【会议总结】\n${summary}\n\n`;
            email += `【待办事项】\n`;
            
            actions.forEach((action, index) => {
                email += `${index + 1}. ${action.task}\n`;
                email += `   负责人：${action.owner}\n`;
                email += `   截止日期：${action.deadline}\n\n`;
            });
            
            email += `请各位按时完成相关任务。如有疑问，请及时沟通。\n\n`;
            email += `Best regards,\n`;
            email += `AI Meeting Copilot (智能会议助手)`;
            
            return email;
        }
        
        // 更新UI
        function updateUI() {
            document.getElementById('summary').innerHTML = marked.parse(currentData.summary || '暂无总结');
            document.getElementById('decisions').innerHTML = marked.parse(currentData.decisions || '暂无决策');
            
            if (currentData.actions && currentData.actions.length > 0) {
                let actionsHtml = '';
                currentData.actions.forEach((action, index) => {
                    actionsHtml += `
                        <div class="border border-gray-200 rounded-lg p-3 hover:bg-gray-50">
                            <div class="flex items-start justify-between">
                                <div class="flex-1">
                                    <div class="font-medium text-gray-900">${escapeHtml(action.task)}</div>
                                    <div class="flex gap-4 mt-1 text-sm text-gray-500">
                                        <span>👤 负责人: ${escapeHtml(action.owner || '待定')}</span>
                                        <span>📅 截止: ${escapeHtml(action.deadline || '待定')}</span>
                                    </div>
                                </div>
                                <input type="checkbox" class="mt-1 w-4 h-4" onchange="toggleTask(${index}, this.checked)">
                            </div>
                        </div>
                    `;
                });
                document.getElementById('actions').innerHTML = actionsHtml;
            } else {
                document.getElementById('actions').innerHTML = '<p class="text-gray-400 text-sm">暂无行动项</p>';
            }
            
            document.getElementById('email').innerText = currentData.email || '暂无邮件内容';
        }
        
        // 辅助函数
        window.toggleTask = function(index, completed) {
            if (completed) {
                showToast(`✅ 任务完成: ${currentData.actions[index].task.substring(0, 30)}...`, 'success');
            }
        };
        
        window.exportToNotion = function() {
            if (!currentData.actions || currentData.actions.length === 0) {
                showToast('没有行动项可导出', 'error');
                return;
            }
            const tasks = currentData.actions.map(a => `${a.task} (${a.owner})`).join('\n');
            navigator.clipboard.writeText(tasks);
            showToast('✅ 任务列表已复制，可粘贴到Notion', 'success');
        };
        
        window.exportToJira = function() {
            if (!currentData.actions || currentData.actions.length === 0) {
                showToast('没有行动项可导出', 'error');
                return;
            }
            const jiraFormat = currentData.actions.map(a => `- [ ] ${a.task} // 负责人: ${a.owner} // 截止: ${a.deadline}`).join('\n');
            navigator.clipboard.writeText(jiraFormat);
            showToast('✅ Jira格式任务已复制', 'success');
        };
        
        window.copyEmail = function() {
            if (!currentData.email) {
                showToast('没有邮件内容', 'error');
                return;
            }
            navigator.clipboard.writeText(currentData.email);
            showToast('📋 邮件已复制到剪贴板', 'success');
        };
        
        window.sendEmail = function() {
            if (!currentData.email) {
                showToast('没有邮件内容', 'error');
                return;
            }
            window.location.href = `mailto:?subject=会议跟进&body=${encodeURIComponent(currentData.email)}`;

            document.getElementById('meetingText').value = example;

        window.clearAll = function() {
            if (confirm('确定清空所有数据吗？')) {
                document.getElementById('meetingText').value = '';
                document.getElementById('transcribedText').value = '';
                clearRecording();
                currentData = { summary: '', decisions: '', actions: [], email: '' };
                updateUI();
                showToast('已清空', 'info');
            }
        };
        
        function saveToHistory(meetingText, result) {
            const history = JSON.parse(localStorage.getItem('meeting_history_free') || '[]');
            history.unshift({
                id: Date.now(),
                date: new Date().toISOString(),
                preview: meetingText.substring(0, 100) + '...',
                data: result
            });
            while (history.length > 20) history.pop();
            localStorage.setItem('meeting_history_free', JSON.stringify(history));
            loadHistory();
        }
        
        function loadHistory() {
            const history = JSON.parse(localStorage.getItem('meeting_history_free') || '[]');
            const container = document.getElementById('historyList');
            
            if (history.length === 0) {
                container.innerHTML = '<p class="text-gray-400 text-sm">暂无历史记录</p>';
                return;
            }
            
            container.innerHTML = history.map(item => `
                <div class="border border-gray-200 rounded-lg p-2 hover:bg-gray-50 cursor-pointer" onclick="loadHistoryItem(${item.id})">
                    <div class="text-xs text-gray-500">${new Date(item.date).toLocaleString()}</div>
                    <div class="text-sm text-gray-700 truncate">${escapeHtml(item.preview)}</div>
                </div>
            `).join('');
        }
        
        window.loadHistoryItem = function(id) {
            const history = JSON.parse(localStorage.getItem('meeting_history_free') || '[]');
            const item = history.find(h => h.id === id);
            if (item && item.data) {
                currentData = item.data;
                updateUI();
                showToast('已加载历史记录', 'success');
            }
        };
        
        function escapeHtml(text) {
            if (!text) return '';
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }
        
        function showToast(message, type = 'info') {
            const toast = document.createElement('div');
            toast.className = 'toast';
            toast.textContent = message;
            document.body.appendChild(toast);
            setTimeout(() => toast.remove(), 3000);
        }
    </script>
