<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Meeting Copilot - 带录音功能 | 智能会议助手</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <style>
        .toast {
            position: fixed;
            bottom: 20px;
            right: 20px;
            background: #1f2937;
            color: white;
            padding: 12px 24px;
            border-radius: 8px;
            z-index: 1000;
            animation: slideIn 0.3s ease;
        }
        @keyframes slideIn {
            from { transform: translateX(100%); opacity: 0; }
            to { transform: translateX(0); opacity: 1; }
        }
        .loading {
            display: inline-block;
            width: 20px;
            height: 20px;
            border: 2px solid #f3f3f3;
            border-top: 2px solid #3b82f6;
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        .recording {
            animation: pulse 1.5s infinite;
        }
        @keyframes pulse {
            0% { box-shadow: 0 0 0 0 rgba(239, 68, 68, 0.7); }
            70% { box-shadow: 0 0 0 10px rgba(239, 68, 68, 0); }
            100% { box-shadow: 0 0 0 0 rgba(239, 68, 68, 0); }
        }
        .waveform {
            display: flex;
            align-items: center;
            gap: 3px;
            height: 40px;
        }
        .waveform-bar {
            width: 3px;
            height: 20px;
            background-color: #ef4444;
            animation: wave 0.8s ease-in-out infinite;
        }
        @keyframes wave {
            0%, 100% { height: 10px; }
            50% { height: 30px; }
        }
    </style>
</head>
<body class="bg-gray-50">
    <div class="max-w-7xl mx-auto px-4 py-8">
        <!-- Header -->
        <div class="text-center mb-8">
            <h1 class="text-3xl font-bold text-gray-900">🎙️ AI Meeting Copilot</h1>
            <p class="text-gray-600 mt-2">智能会议助手 - 支持录音、语音转文字、AI分析、任务追踪</p>
        </div>

        <!-- API Key 配置 -->
        <div class="bg-yellow-50 border border-yellow-200 rounded-lg p-4 mb-6">
            <div class="flex items-center gap-2 mb-2">
                <span class="text-yellow-800 font-semibold">⚠️ 配置说明：</span>
                <span class="text-yellow-700 text-sm">需要OpenAI API Key才能使用AI分析功能</span>
            </div>
            <div class="flex gap-2">
                <input type="password" id="apiKey" placeholder="sk-..." class="flex-1 px-3 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500">
                <button onclick="saveApiKey()" class="px-4 py-2 bg-blue-600 text-white rounded-lg hover:bg-blue-700">保存</button>
                <button onclick="testApiKey()" class="px-4 py-2 bg-gray-600 text-white rounded-lg hover:bg-gray-700">测试连接</button>
            </div>
            <p class="text-xs text-gray-600 mt-2">💡 获取Key: <a href="https://platform.openai.com/api-keys" target="_blank" class="text-blue-600">https://platform.openai.com/api-keys</a></p>
        </div>

        <div class="grid lg:grid-cols-2 gap-6">
            <!-- 左侧：录音和输入区域 -->
            <div class="space-y-6">
                <!-- 录音卡片 -->
                <div class="bg-white rounded-lg shadow p-6">
                    <h2 class="text-lg font-semibold mb-3">🎤 实时录音</h2>
                    
                    <!-- 录音控制区 -->
                    <div class="bg-gradient-to-r from-red-50 to-orange-50 rounded-lg p-4 mb-4">
                        <div class="flex items-center justify-between mb-3">
                            <div class="flex gap-3">
                                <button id="startRecordBtn" onclick="startRecording()" class="px-5 py-2 bg-red-600 text-white rounded-lg hover:bg-red-700 flex items-center gap-2">
                                    <i class="fas fa-microphone"></i> 开始录音
                                </button>
                                <button id="stopRecordBtn" onclick="stopRecording()" disabled class="px-5 py-2 bg-gray-400 text-white rounded-lg cursor-not-allowed flex items-center gap-2">
                                    <i class="fas fa-stop"></i> 停止录音
                                </button>
                                <button onclick="clearRecording()" class="px-4 py-2 bg-gray-200 text-gray-700 rounded-lg hover:bg-gray-300">
                                    <i class="fas fa-trash"></i> 清除
                                </button>
                            </div>
                            <div id="recordStatus" class="text-sm text-gray-600">
                                ⚪ 未开始
                            </div>
                        </div>
                        
                        <!-- 波形可视化 -->
                        <div id="waveform" class="waveform justify-center hidden">
                            <div class="waveform-bar" style="animation-delay: 0s"></div>
                            <div class="waveform-bar" style="animation-delay: 0.1s"></div>
                            <div class="waveform-bar" style="animation-delay: 0.2s"></div>
                            <div class="waveform-bar" style="animation-delay: 0.3s"></div>
                            <div class="waveform-bar" style="animation-delay: 0.4s"></div>
                            <div class="waveform-bar" style="animation-delay: 0.5s"></div>
                            <div class="waveform-bar" style="animation-delay: 0.6s"></div>
                            <div class="waveform-bar" style="animation-delay: 0.7s"></div>
                        </div>
                        
                        <!-- 录音时长 -->
                        <div id="recordDuration" class="text-xs text-gray-500 mt-2 hidden">
                            录音时长: <span id="duration">0</span> 秒
                        </div>
                    </div>
                    
                    <!-- 转写结果 -->
                    <div class="mt-4">
                        <div class="flex justify-between items-center mb-2">
                            <label class="font-medium text-gray-700">📝 转写文本</label>
                            <button onclick="transcribeAudio()" id="transcribeBtn" disabled class="text-sm bg-green-600 text-white px-3 py-1 rounded-lg hover:bg-green-700 disabled:bg-gray-300 disabled:cursor-not-allowed">
                                🎯 AI转写文字
                            </button>
                        </div>
                        <textarea id="transcribedText" rows="6" class="w-full border border-gray-300 rounded-lg p-3 focus:outline-none focus:ring-2 focus:ring-blue-500 font-mono text-sm" placeholder="录音转写结果会显示在这里..."></textarea>
                    </div>
                </div>
                
                <!-- 会议记录输入（备用） -->
                <div class="bg-white rounded-lg shadow p-6">
                    <h2 class="text-lg font-semibold mb-3">📝 或直接粘贴会议记录</h2>
                    <textarea id="meetingText" rows="8" class="w-full border border-gray-300 rounded-lg p-3 focus:outline-none focus:ring-2 focus:ring-blue-500 font-mono text-sm" placeholder="也可以直接粘贴会议记录..."></textarea>
                    <div class="flex gap-2 mt-4">
                        <button onclick="processWithAI()" id="processBtn" class="flex-1 px-4 py-2 bg-blue-600 text-white rounded-lg hover:bg-blue-700 font-medium">
                            🚀 AI 智能分析
                        </button>
                        <button onclick="loadExample()" class="px-4 py-2 bg-gray-200 text-gray-700 rounded-lg hover:bg-gray-300">
                            示例数据
                        </button>
                        <button onclick="clearAll()" class="px-4 py-2 bg-gray-200 text-gray-700 rounded-lg hover:bg-gray-300">
                            清空
                        </button>
                    </div>
                </div>

                <!-- 本地存储的会议历史 -->
                <div class="bg-white rounded-lg shadow p-6">
                    <h2 class="text-lg font-semibold mb-3">📚 历史会议</h2>
                    <div id="historyList" class="space-y-2 max-h-48 overflow-y-auto">
                        <p class="text-gray-400 text-sm">暂无历史记录</p>
                    </div>
                </div>
            </div>

            <!-- 右侧：AI输出区域（与之前相同） -->
            <div class="space-y-6">
                <div class="bg-white rounded-lg shadow p-6">
                    <h2 class="text-lg font-semibold mb-3">📌 AI 会议总结</h2>
                    <div id="summary" class="prose max-w-none text-gray-700 text-sm leading-relaxed bg-gray-50 p-4 rounded-lg min-h-[100px]">
                        等待分析...
                    </div>
                </div>

                <div class="bg-white rounded-lg shadow p-6">
                    <h2 class="text-lg font-semibold mb-3">⚖️ 决策 & 风险</h2>
                    <div id="decisions" class="bg-gray-50 p-4 rounded-lg min-h-[100px] text-sm">
                        等待分析...
                    </div>
                </div>

                <div class="bg-white rounded-lg shadow p-6">
                    <h2 class="text-lg font-semibold mb-3">✅ 行动项</h2>
                    <div id="actions" class="space-y-2">
                        <p class="text-gray-400 text-sm">等待分析...</p>
                    </div>
                    <div class="flex gap-2 mt-4 pt-4 border-t">
                        <button onclick="exportToNotion()" class="flex-1 px-3 py-2 bg-purple-600 text-white rounded-lg hover:bg-purple-700 text-sm">
                            📤 导出到 Notion
                        </button>
                        <button onclick="exportToJira()" class="flex-1 px-3 py-2 bg-blue-600 text-white rounded-lg hover:bg-blue-700 text-sm">
                            🔷 导出到 Jira
                        </button>
                    </div>
                </div>

                <div class="bg-white rounded-lg shadow p-6">
                    <h2 class="text-lg font-semibold mb-3">📧 跟进邮件</h2>
                    <div id="email" class="bg-gray-50 p-4 rounded-lg text-sm font-mono whitespace-pre-wrap min-h-[150px]">
                        等待生成...
                    </div>
                    <div class="flex gap-2 mt-4">
                        <button onclick="copyEmail()" class="flex-1 px-3 py-2 bg-green-600 text-white rounded-lg hover:bg-green-700 text-sm">
                            📋 复制邮件
                        </button>
                        <button onclick="sendEmail()" class="flex-1 px-3 py-2 bg-indigo-600 text-white rounded-lg hover:bg-indigo-700 text-sm">
                            ✉️ 模拟发送
                        </button>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        // 全局变量
        let currentData = {
            summary: '',
            decisions: '',
            actions: [],
            email: ''
        };
        
        // 录音相关变量
        let mediaRecorder = null;
        let audioChunks = [];
        let isRecording = false;
        let startTime = null;
        let durationInterval = null;
        let recordedBlob = null;

        // 初始化
        const savedKey = localStorage.getItem('openai_api_key');
        if (savedKey) {
            document.getElementById('apiKey').value = savedKey;
        }
        loadHistory();

        // 保存API Key
        window.saveApiKey = function() {
            const key = document.getElementById('apiKey').value.trim();
            if (key) {
                localStorage.setItem('openai_api_key', key);
                showToast('API Key已保存', 'success');
            } else {
                localStorage.removeItem('openai_api_key');
                showToast('已清除API Key', 'info');
            }
        };

        // 测试API Key
        window.testApiKey = async function() {
            const key = document.getElementById('apiKey').value.trim();
            if (!key) {
                showToast('请先输入API Key', 'error');
                return;
            }
            
            showToast('测试中...', 'info');
            try {
                const response = await fetch('https://api.openai.com/v1/models', {
                    headers: { 'Authorization': `Bearer ${key}` }
                });
                
                if (response.ok) {
                    showToast('✅ API Key有效！', 'success');
                } else {
                    showToast('❌ API Key无效，请检查', 'error');
                }
            } catch (error) {
                showToast('网络错误，无法连接OpenAI', 'error');
            }
        };

        // 开始录音
        window.startRecording = async function() {
            try {
                const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
                
                mediaRecorder = new MediaRecorder(stream);
                audioChunks = [];
                
                mediaRecorder.ondataavailable = (event) => {
                    audioChunks.push(event.data);
                };
                
                mediaRecorder.onstop = () => {
                    recordedBlob = new Blob(audioChunks, { type: 'audio/webm' });
                    document.getElementById('transcribeBtn').disabled = false;
                    showToast('录音完成！可以开始转写', 'success');
                    
                    // 停止所有音轨
                    stream.getTracks().forEach(track => track.stop());
                };
                
                mediaRecorder.start();
                isRecording = true;
                startTime = Date.now();
                
                // 更新UI
                document.getElementById('startRecordBtn').disabled = true;
                document.getElementById('stopRecordBtn').disabled = false;
                document.getElementById('recordStatus').innerHTML = '🔴 录音中...';
                document.getElementById('waveform').classList.remove('hidden');
                document.getElementById('recordDuration').classList.remove('hidden');
                
                // 更新时长
                durationInterval = setInterval(() => {
                    const seconds = Math.floor((Date.now() - startTime) / 1000);
                    document.getElementById('duration').innerText = seconds;
                }, 1000);
                
            } catch (error) {
                console.error('录音失败:', error);
                showToast('无法访问麦克风，请检查权限', 'error');
            }
        };

        // 停止录音
        window.stopRecording = function() {
            if (mediaRecorder && isRecording) {
                mediaRecorder.stop();
                isRecording = false;
                
                // 更新UI
                document.getElementById('startRecordBtn').disabled = false;
                document.getElementById('stopRecordBtn').disabled = true;
                document.getElementById('recordStatus').innerHTML = '⚪ 录音已停止';
                
                if (durationInterval) {
                    clearInterval(durationInterval);
                    durationInterval = null;
                }
            }
        };

        // 清除录音
        window.clearRecording = function() {
            recordedBlob = null;
            document.getElementById('transcribedText').value = '';
            document.getElementById('transcribeBtn').disabled = true;
            document.getElementById('waveform').classList.add('hidden');
            document.getElementById('recordDuration').classList.add('hidden');
            showToast('已清除录音', 'info');
        };

        // AI转写音频（使用OpenAI Whisper）
        window.transcribeAudio = async function() {
            if (!recordedBlob) {
                showToast('没有录音文件，请先录音', 'error');
                return;
            }
            
            const apiKey = document.getElementById('apiKey').value.trim();
            if (!apiKey) {
                showToast('请先配置OpenAI API Key', 'error');
                return;
            }
            
            showToast('正在转写音频...可能需要几秒钟', 'info');
            
            try {
                // 创建FormData
                const formData = new FormData();
                formData.append('file', recordedBlob, 'recording.webm');
                formData.append('model', 'whisper-1');
                formData.append('language', 'zh');
                
                const response = await fetch('https://api.openai.com/v1/audio/transcriptions', {
                    method: 'POST',
                    headers: {
                        'Authorization': `Bearer ${apiKey}`
                    },
                    body: formData
                });
                
                if (!response.ok) {
                    const error = await response.json();
                    throw new Error(error.error?.message || '转写失败');
                }
                
                const data = await response.json();
                const transcribedText = data.text;
                
                document.getElementById('transcribedText').value = transcribedText;
                document.getElementById('meetingText').value = transcribedText;
                
                showToast('✅ 转写完成！可以开始AI分析', 'success');
                
                // 自动分析
                setTimeout(() => {
                    if (confirm('是否立即分析这段会议记录？')) {
                        processWithAI();
                    }
                }, 500);
                
            } catch (error) {
                console.error('转写失败:', error);
                showToast('转写失败: ' + error.message, 'error');
            }
        };

        // AI处理（与之前相同，但会优先使用转写的文本）
        window.processWithAI = async function() {
            let meetingText = document.getElementById('meetingText').value.trim();
            
            // 如果有转写文本且meetingText为空，使用转写文本
            const transcribedText = document.getElementById('transcribedText').value.trim();
            if (!meetingText && transcribedText) {
                meetingText = transcribedText;
                document.getElementById('meetingText').value = transcribedText;
            }
            
            if (!meetingText) {
                showToast('请先录音转写或输入会议记录', 'error');
                return;
            }

            const apiKey = document.getElementById('apiKey').value.trim();
            if (!apiKey) {
                showToast('请先配置OpenAI API Key', 'error');
                return;
            }

            const btn = document.getElementById('processBtn');
            const originalText = btn.innerHTML;
            btn.innerHTML = '<span class="loading"></span> AI分析中...';
            btn.disabled = true;

            try {
                const result = await callOpenAI(meetingText, apiKey);
                currentData = result;
                updateUI();
                saveToHistory(meetingText, result);
                showToast('✅ AI分析完成！', 'success');
            } catch (error) {
                console.error('AI处理失败:', error);
                showToast('AI处理失败: ' + error.message, 'error');
            } finally {
                btn.innerHTML = originalText;
                btn.disabled = false;
            }
        };

        // 调用OpenAI API（与之前相同）
        async function callOpenAI(meetingText, apiKey) {
            const prompt = `你是一个专业的AI会议助手。请分析以下会议记录，输出JSON格式结果。

会议记录：
${meetingText}

请严格按照以下JSON格式输出（不要添加任何其他文字）：
{
    "summary": "简洁的会议总结，包含主要讨论内容和结论",
    "decisions": "列出关键决策，每行一个决策，用-开头",
    "actions": [
        {"task": "具体任务", "owner": "负责人", "deadline": "截止日期"}
    ],
    "email": "完整的跟进邮件，包含称呼、会议总结、行动项列表、结束语"
}

注意：
1. actions至少生成2-4个
2. 如果会议中没有明确负责人，请根据上下文合理推断
3. deadline使用YYYY-MM-DD格式，如果没提到就写"待定"
4. 邮件要正式、专业`;

            const response = await fetch('https://api.openai.com/v1/chat/completions', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                    'Authorization': `Bearer ${apiKey}`
                },
                body: JSON.stringify({
                    model: 'gpt-3.5-turbo',
                    messages: [
                        { role: 'system', content: '你是一个专业的会议助手，总是输出JSON格式。' },
                        { role: 'user', content: prompt }
                    ],
                    temperature: 0.3
                })
            });

            if (!response.ok) {
                const error = await response.json();
                throw new Error(error.error?.message || 'API调用失败');
            }

            const data = await response.json();
            const content = data.choices[0].message.content;
            
            try {
                return JSON.parse(content);
            } catch (e) {
                console.error('JSON解析失败:', content);
                throw new Error('AI返回格式错误');
            }
        }

        // 更新UI（与之前相同）
        function updateUI() {
            document.getElementById('summary').innerHTML = marked.parse(currentData.summary || '暂无总结');
            document.getElementById('decisions').innerHTML = marked.parse(currentData.decisions || '暂无决策');
            
            if (currentData.actions && currentData.actions.length > 0) {
                let actionsHtml = '';
                currentData.actions.forEach((action, index) => {
                    actionsHtml += `
                        <div class="border border-gray-200 rounded-lg p-3 hover:bg-gray-50">
                            <div class="flex items-start justify-between">
                                <div class="flex-1">
                                    <div class="font-medium text-gray-900">${escapeHtml(action.task)}</div>
                                    <div class="flex gap-4 mt-1 text-sm text-gray-500">
                                        <span>👤 负责人: ${escapeHtml(action.owner || '待定')}</span>
                                        <span>📅 截止: ${escapeHtml(action.deadline || '待定')}</span>
                                    </div>
                                </div>
                                <input type="checkbox" class="mt-1 w-4 h-4" onchange="toggleTask(${index}, this.checked)">
                            </div>
                        </div>
                    `;
                });
                document.getElementById('actions').innerHTML = actionsHtml;
            } else {
                document.getElementById('actions').innerHTML = '<p class="text-gray-400 text-sm">暂无行动项</p>';
            }
            
            document.getElementById('email').innerText = currentData.email || '暂无邮件内容';
        }

        // 辅助函数
        window.toggleTask = function(index, completed) {
            if (completed) {
                showToast(`✅ 任务完成: ${currentData.actions[index].task.substring(0, 30)}...`, 'success');
            }
        };

        window.exportToNotion = function() {
            if (!currentData.actions || currentData.actions.length === 0) {
                showToast('没有行动项可导出', 'error');
                return;
            }
            showToast('✅ 已导出到Notion（演示模式）\n实际集成需要配置Notion API', 'success');
        };

        window.exportToJira = function() {
            if (!currentData.actions || currentData.actions.length === 0) {
                showToast('没有行动项可导出', 'error');
                return;
            }
            showToast('✅ 已导出到Jira（演示模式）\n实际集成需要配置Jira API', 'success');
        };

        window.copyEmail = function() {
            if (!currentData.email) {
                showToast('没有邮件内容', 'error');
                return;
            }
            navigator.clipboard.writeText(currentData.email);
            showToast('📋 邮件已复制到剪贴板', 'success');
        };

        window.sendEmail = function() {
            if (!currentData.email) {
                showToast('没有邮件内容', 'error');
                return;
            }
            showToast('✉️ 邮件已发送（演示模式）', 'success');
        };

        window.loadExample = function() {
            const example = `产品迭代周会 - 2025年4月1日

参会人员：张明、李华、王芳、赵磊

讨论内容：
1. 移动端3.0版本开发进度 - 前端80%，后端70%
2. 性能优化问题 - 首页加载2.5秒，目标1.5秒
3. 测试环境稳定性问题

决策：
- 4月10日发布Beta版本
- 正式版本延期到4月25日

风险：
- 第三方支付SDK审核需要5个工作日
- 服务器扩容申请尚未批复

行动项：
1. 李华完成登录页面开发，4月5日前
2. 王芳完成订单接口，4月6日前
3. 赵磊提交服务器扩容申请，今天完成`;

            document.getElementById('meetingText').value = example;
            showToast('示例数据已加载', 'success');
        };

        window.clearAll = function() {
            if (confirm('确定清空所有数据吗？')) {
                document.getElementById('meetingText').value = '';
                document.getElementById('transcribedText').value = '';
                clearRecording();
                currentData = { summary: '', decisions: '', actions: [], email: '' };
                updateUI();
                showToast('已清空', 'info');
            }
        };

        function saveToHistory(meetingText, result) {
            const history = JSON.parse(localStorage.getItem('meeting_history') || '[]');
            history.unshift({
                id: Date.now(),
                date: new Date().toISOString(),
                preview: meetingText.substring(0, 100) + '...',
                data: result
            });
            while (history.length > 20) history.pop();
            localStorage.setItem('meeting_history', JSON.stringify(history));
            loadHistory();
        }

        function loadHistory() {
            const history = JSON.parse(localStorage.getItem('meeting_history') || '[]');
            const container = document.getElementById('historyList');
            
            if (history.length === 0) {
                container.innerHTML = '<p class="text-gray-400 text-sm">暂无历史记录</p>';
                return;
            }
            
            container.innerHTML = history.map(item => `
                <div class="border border-gray-200 rounded-lg p-2 hover:bg-gray-50 cursor-pointer" onclick="loadHistoryItem(${item.id})">
                    <div class="text-xs text-gray-500">${new Date(item.date).toLocaleString()}</div>
                    <div class="text-sm text-gray-700 truncate">${escapeHtml(item.preview)}</div>
                </div>
            `).join('');
        }

        window.loadHistoryItem = function(id) {
            const history = JSON.parse(localStorage.getItem('meeting_history') || '[]');
            const item = history.find(h => h.id === id);
            if (item && item.data) {
                currentData = item.data;
                updateUI();
                showToast('已加载历史记录', 'success');
            }
        };

        function escapeHtml(text) {
            if (!text) return '';
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        function showToast(message, type = 'info') {
            const toast = document.createElement('div');
            toast.className = 'toast';
            toast.textContent = message;
            document.body.appendChild(toast);
            setTimeout(() => toast.remove(), 3000);
        }
    </script>
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
</body>
